<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Diagram Design - Academic Presentation Deck</title>
<style>
  @page {
    size: 1920px 1080px;
    margin: 0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f1117;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
  }
  .slide-container {
    width: 1920px;
    height: 1080px;
    page-break-after: always;
    break-after: page;
    position: relative;
    overflow: hidden;
  }
  .slide-frame {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
  .slide-img {
    width: 1920px;
    height: 1080px;
    display: block;
    object-fit: contain;
  }
</style>
</head>
<body>
  <div class="slide-container">
    <img class="slide-img" src="slide1_about.png" alt="Slide 1">
  </div>
  <div class="slide-container">
    <img class="slide-img" src="slide2_how_it_works.png" alt="Slide 2">
  </div>
  <div class="slide-container">
    <img class="slide-img" src="slide3_advantages.png" alt="Slide 3">
  </div>
  <div class="slide-container">
    <img class="slide-img" src="slide4_use_cases.png" alt="Slide 4">
  </div>
  <div class="slide-container" style="page-break-after: auto; break-after: auto;">
    <img class="slide-img" src="slide5_future_conclusion.png" alt="Slide 5">
  </div>
</body>
</html>
